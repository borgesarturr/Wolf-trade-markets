<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Wolf Trade Markets</title>
</head>

<body>

    <button id="btnLogOut" class="btnLogOut" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8" />
            <polyline points="16 8 20 12 16 16" />
            <line x1="10" y1="12" x2="20" y2="12" />
        </svg>

    </button>

    <!-- Painel de Moedas Real-Time -->
    <div class="crypto-panel">

        <h2>Mercado em Tempo Real</h2>

        <div class="crypto-container">
            <!-- Bitcoin -->
            <div class="crypto-card" id="btc-card">
                <h3>Bitcoin (BTC)</h3>
                <p class="price">Carregando...</p>
                <canvas id="btc-chart" height="60"></canvas>
            </div>
            <!-- Ethereum -->
            <div class="crypto-card" id="eth-card">
                <h3>Ethereum (ETH)</h3>
                <p class="price">Carregando...</p>
                <canvas id="eth-chart" height="60"></canvas>
            </div>
            <!-- XRP -->
            <div class="crypto-card" id="xrp-card">
                <h3>Ripple (XRP)</h3>
                <p class="price">Carregando...</p>
                <canvas id="xrp-chart" height="60"></canvas>
            </div>
            <!-- Solana -->
            <div class="crypto-card" id="sol-card">
                <h3>Solana (SOL)</h3>
                <p class="price">Carregando...</p>
                <canvas id="sol-chart" height="60"></canvas>
            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="dashboard.js"></script>
</body>

</html>
